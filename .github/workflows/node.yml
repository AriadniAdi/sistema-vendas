name: Node CI

on:
  pull_request:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Verificar versões
        run: |
          which node
          node --version
          npm --version

      - name: Instalar dependências
        run: npm ci

      - name: Rodar testes
        run: npm test

      - name: Rodar lint
        run: npm run lint

      - name: Gerar build
        run: npm run build
