name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Usar Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Confirmar versão do Node
        run: node --version

      - name: Instalar dependências
        run: npm ci

      - name: Rodar build
        run: npm run build

      - name: Rodar testes
        run: npm test
